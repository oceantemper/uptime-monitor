# Local development dependencies only.
# The credentials below are intentionally non-secret: this stack binds to
# localhost and is never deployed. Real connection strings live in
# dotnet user-secrets (local) or environment variables (deployed).

services:
  postgres:
    image: postgres:17-alpine
    container_name: uptime-monitor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: uptimemonitor
      POSTGRES_USER: uptime
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime -d uptimemonitor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
